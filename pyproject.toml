[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["collectors", "core", "engines", "publishers", "db", "config", "utils", "reply_engine", "following_engine", "shock_news_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
