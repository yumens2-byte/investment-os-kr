name: Backdata Card

# DN2026_0090 백데이터 반전 카드 — KST 평일 17:41 (장 마감 15:30 이후, 비정각 STD-SCHED-02)
# 인접 cron: following 매시 :23 / reply 09:17 UTC / shock 06:55 UTC
on:
  schedule:
    - cron: "41 8 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드 (dispatch 기본 dry_run)"
        type: choice
        options: [dry_run, shadow, live]
        default: dry_run
      step:
        description: "단계"
        type: choice
        options: [post, metrics, preflight]
        default: post

concurrency:
  group: backdata-card
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - name: 전수 테스트 (실패 시 파이프라인 차단)
        run: python -m pytest -q tests/

  metrics:
    needs: test
    if: github.event_name == 'schedule' || inputs.step == 'metrics'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: 성과 수집
        env:
          BACKDATA_ENABLED: ${{ vars.BACKDATA_ENABLED }}
          BACKDATA_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.BACKDATA_MODE || 'dry_run' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FACE_PAGE_TOKEN: ${{ secrets.FACE_PAGE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: python run_backdata.py --step metrics
      - name: 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backdata-metrics-${{ github.run_id }}
          path: |
            logs/backdata_report_*.json
            logs/backdata_*.log
          retention-days: 14

  post:
    needs: test
    if: github.event_name == 'schedule' || inputs.step != 'metrics'
    runs-on: ubuntu-latest
    timeout-minutes: 60        # 랜덤 지연 최대 40분(BACKDATA_DELAY_MAX_SEC 상한 2400) + 처리
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: 카드 발행
        env:
          STEP: ${{ github.event_name == 'workflow_dispatch' && inputs.step || 'post' }}
          BACKDATA_ENABLED: ${{ vars.BACKDATA_ENABLED }}
          BACKDATA_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.BACKDATA_MODE || 'dry_run' }}
          BACKDATA_DELAY_MAX_SEC: ${{ vars.BACKDATA_DELAY_MAX_SEC }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Gemini 무료 키 3종만 주입 — 유료 키는 주입하지 않음 (비용 0, DN2026_0090)
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_SUB_KEY:     ${{ secrets.GEMINI_API_SUB_KEY }}
          GEMINI_API_SUB_SUB_KEY: ${{ secrets.GEMINI_API_SUB_SUB_KEY }}
          FACE_PAGE_ID: ${{ secrets.FACE_PAGE_ID }}
          FACE_PAGE_TOKEN: ${{ secrets.FACE_PAGE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: python run_backdata.py --step "$STEP"
      - name: 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backdata-post-${{ github.run_id }}
          path: |
            logs/backdata_report_*.json
            logs/backdata_*.log
          retention-days: 14
