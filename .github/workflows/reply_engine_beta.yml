name: Reply Engine Operational Beta

# Only an explicit approved marker plus a review/residual record change triggers beta.
# No schedule. Repeating requires a new deliberate marker commit.
on:
  push:
    branches: [main]
    paths: ["docs/REPLY_ENGINE_V2_REVIEW.md", "docs/REPLY_ENGINE_V2_RESIDUAL.md"]

permissions:
  contents: read

concurrency:
  group: reply-engine
  cancel-in-progress: false

jobs:
  test:
    if: contains(github.event.head_commit.message, 'reply-engine-v2-approved-beta') || contains(github.event.head_commit.message, 'reply-engine-v2-residual-check') || contains(github.event.head_commit.message, 'reply-engine-v2-schema-probe')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest==9.1.1 ruff==0.16.10
      - run: ruff check run_reply.py reply_engine core/gemini_gateway.py scripts/reply_operational_beta.py scripts/reply_quality_replay.py tests/test_reply_v2.py tests/test_reply_review_safety.py tests/test_reply_review_quality.py tests/test_reply_sdk_integration.py tests/test_reply_beta.py tests/test_reply_quality_replay.py tests/test_check_reply_db.py tests/test_reply_db_audit_codes.py scripts/check_reply_db.py
      - run: python -m pytest -q tests/

  beta:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Approved dry-run and one-reply live beta
        env:
          RESIDUAL_CHECK: ${{ contains(github.event.head_commit.message, 'reply-engine-v2-residual-check') }}
          SCHEMA_PROBE: ${{ contains(github.event.head_commit.message, 'reply-engine-v2-schema-probe') }}
          REPLY_EXPECTED_DB_REF: "ccomoimhhttaklfadaos"
          # X (Twitter) OAuth 1.0a
          X_API_KEY:              ${{ secrets.X_API_KEY }}
          X_API_SECRET:           ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:         ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET:  ${{ secrets.X_ACCESS_TOKEN_SECRET }}

          # Supabase
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:           ${{ secrets.SUPABASE_KEY }}

          # Gemini 4키 chain (Main → Sub → Sub2 → Pay)
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_SUB_KEY:     ${{ secrets.GEMINI_API_SUB_KEY }}
          GEMINI_API_SUB_SUB_KEY: ${{ secrets.GEMINI_API_SUB_SUB_KEY }}
          GEMINI_API_SUB_PAY_KEY: ${{ secrets.GEMINI_API_SUB_PAY_KEY }}

          # 운영 제어 (GitHub Variables — HG-1/HG-3)
          REPLY_ENABLED:          ${{ vars.REPLY_ENABLED }}
          # v1.0.6 (2026-08-27): 일일 답글 상한 운영값 — 미등록 시 코드 기본값 8 (env_int 안전 파서)
          REPLY_DAILY_CAP:        ${{ vars.REPLY_DAILY_CAP }}
          REPLY_RUN_CAP:          "1"
          REPLY_AUTHOR_DAILY_CAP: ${{ vars.REPLY_AUTHOR_DAILY_CAP }}
          REPLY_CONV_DAILY_CAP:   ${{ vars.REPLY_CONV_DAILY_CAP }}
          REPLY_MAX_AGE_HOURS:    ${{ vars.REPLY_MAX_AGE_HOURS }}
          REPLY_RETRY_WINDOW_HOURS: ${{ vars.REPLY_RETRY_WINDOW_HOURS }}
          REPLY_MENTIONS_MAX_RESULTS: ${{ vars.REPLY_MENTIONS_MAX_RESULTS }}
          REPLY_MENTIONS_MAX_PAGES: ${{ vars.REPLY_MENTIONS_MAX_PAGES }}
          REPLY_CURSOR_STALE_WARN_HOURS: ${{ vars.REPLY_CURSOR_STALE_WARN_HOURS }}
          # 타인 원글 스레드 응답은 명시적 opt-in. 미등록/false이면 코드 기본 차단.
          REPLY_LINK_REVIEW_ENABLED: ${{ vars.REPLY_LINK_REVIEW_ENABLED }}
          REPLY_FOREIGN_THREAD_ENABLED: ${{ vars.REPLY_FOREIGN_THREAD_ENABLED }}
          REPLY_FOREIGN_THREAD_RUN_CAP: ${{ vars.REPLY_FOREIGN_THREAD_RUN_CAP }}
          REPLY_PUBLISH_DELAY_MAX_SEC: "0"
          REPLY_LIKE_ENABLED:     "false"
          REPLY_LIKE_PER_RUN:     ${{ vars.REPLY_LIKE_PER_RUN }}
          REPLY_LIKE_PER_DAY:     ${{ vars.REPLY_LIKE_PER_DAY }}
          DAILY_BUDGET_KRW:       ${{ vars.DAILY_BUDGET_KRW }}
          X_READ_COST_KRW:        ${{ vars.X_READ_COST_KRW }}
          X_WRITE_COST_KRW:       ${{ vars.X_WRITE_COST_KRW }}
          X_MY_USER_ID:           ${{ vars.X_MY_USER_ID }}

          # 운영 장애 알림 (미설정 시 core.alert가 안전하게 no-op)
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}

        run: |
          if [[ "$SCHEMA_PROBE" == "true" ]]; then
            REPLY_LIKE_ENABLED=true python -m scripts.check_reply_db
          else
            if [[ "$RESIDUAL_CHECK" == "true" ]]; then
              python -m scripts.reply_quality_replay
            fi
            python -m scripts.reply_operational_beta
          fi
      - name: Upload beta reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reply-beta-${{ github.run_id }}
          path: |
            logs/reply_beta_report.json
            logs/reply_quality_replay.json
            logs/reply_report_*.json
            logs/reply_db_audit.json
            logs/reply_*.log
          retention-days: 14
