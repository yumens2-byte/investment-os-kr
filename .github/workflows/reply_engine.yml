name: X Reply Engine

# ──────────────────────────────────────────────────────────────
# v1.0.0 (2026-08-17)
# ──────────────────────────────────────────────────────────────
# 내 게시글 댓글 자동 호응 답글 파이프라인 (run_reply.py)
#
# [제어 — GitHub Variables]
#   REPLY_ENABLED    : 'true'가 아니면 코드가 즉시 종료 (긴급 정지, HG-3)
#   REPLY_MODE       : dry_run | shadow | live (단계 전환은 마스터 수동, HG-1)
#   DAILY_BUDGET_KRW : 일일 비용 상한 (기본 1000)
#   X_READ_COST_KRW / X_WRITE_COST_KRW : 호출 단가 (미설정 시 count 모드 fallback)
#
# [모드 우선순위] dispatch input > vars.REPLY_MODE > 'dry_run' (schedule 안전 기본값)
# [cron] KST 10:17 / 13:17 / 18:17 / 22:17 — 비정각 오프셋 (안티봇 + Actions 정각 skip 방지)
# ──────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "17 1,4,9,13 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드 (미지정 시 vars.REPLY_MODE)"
        type: choice
        options: [dry_run, shadow, live]
        default: live

# L3 가드: cron + dispatch 동시 실행 차단 (중복 답글 방지)
concurrency:
  group: reply-engine
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────
  # Job 1: 테스트 게이트
  # ─────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: pytest -q tests/

  # ─────────────────────────────────────────
  # Job 2: Reply 파이프라인
  # ─────────────────────────────────────────
  reply:
    name: Reply Pipeline
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40   # 시작 지터 5분 + 발행 딜레이 최대 10분 + 발행 간 지터(180s×7) 최악 36분 감안

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Reply Engine
        env:
          # X (Twitter) OAuth 1.0a
          X_API_KEY:              ${{ secrets.X_API_KEY }}
          X_API_SECRET:           ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:         ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET:  ${{ secrets.X_ACCESS_TOKEN_SECRET }}

          # Supabase
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:           ${{ secrets.SUPABASE_KEY }}

          # Gemini 4키 chain (Main → Sub → Sub2 → Pay)
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_SUB_KEY:     ${{ secrets.GEMINI_API_SUB_KEY }}
          GEMINI_API_SUB_SUB_KEY: ${{ secrets.GEMINI_API_SUB_SUB_KEY }}
          GEMINI_API_SUB_PAY_KEY: ${{ secrets.GEMINI_API_SUB_PAY_KEY }}

          # 운영 제어 (GitHub Variables — HG-1/HG-3)
          REPLY_ENABLED:          ${{ vars.REPLY_ENABLED }}
          REPLY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.REPLY_MODE || 'dry_run' }}
          # v1.0.6 (2026-08-27): 일일 답글 상한 운영값 — 미등록 시 코드 기본값 8 (env_int 안전 파서)
          REPLY_DAILY_CAP:        ${{ vars.REPLY_DAILY_CAP }}
          # R-패치 (2026-08-30): 아래 3개는 기존에 배선이 없어 코드 기본값으로 고정돼 있었다.
          #   REPLY_AUTHOR_DAILY_CAP     — 저자별/일 (코드 기본 1, 권고 운영값 2)
          #   REPLY_CONV_DAILY_CAP       — 대화별/일 (코드 기본 3)
          #   REPLY_MENTIONS_MAX_RESULTS — 수집 상한 5~100 (코드 기본 100)
          REPLY_AUTHOR_DAILY_CAP:     ${{ vars.REPLY_AUTHOR_DAILY_CAP }}
          REPLY_CONV_DAILY_CAP:       ${{ vars.REPLY_CONV_DAILY_CAP }}
          REPLY_MENTIONS_MAX_RESULTS: ${{ vars.REPLY_MENTIONS_MAX_RESULTS }}
          # R-10/B (2026-08-30)
          #   REPLY_FOREIGN_THREAD_ENABLED  — 타인 스레드 응답 허용 (기본 true)
          #   REPLY_FOREIGN_THREAD_RUN_CAP  — '회당' 상한. 일 상한 = 값 × cron 4회 (기본 1)
          #   REPLY_CURSOR_STALE_WARN_HOURS — 커서 정체 경고 임계 (기본 24)
          REPLY_FOREIGN_THREAD_ENABLED:  ${{ vars.REPLY_FOREIGN_THREAD_ENABLED }}
          REPLY_FOREIGN_THREAD_RUN_CAP:  ${{ vars.REPLY_FOREIGN_THREAD_RUN_CAP }}
          REPLY_CURSOR_STALE_WARN_HOURS: ${{ vars.REPLY_CURSOR_STALE_WARN_HOURS }}
          DAILY_BUDGET_KRW:       ${{ vars.DAILY_BUDGET_KRW }}
          X_READ_COST_KRW:        ${{ vars.X_READ_COST_KRW }}
          X_WRITE_COST_KRW:       ${{ vars.X_WRITE_COST_KRW }}
          X_MY_USER_ID:           ${{ vars.X_MY_USER_ID }}

        run: python run_reply.py

      # 실행 리포트 artifact (모드 무관 — shadow/live 검수용, HG-2/HG-4)
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reply-report-${{ github.run_id }}
          path: |
            logs/reply_report_*.json
            logs/reply_*.log
          retention-days: 14

  # ─────────────────────────────────────────
  # Job 3: 무음 정지 감지 (R-1, 2026-08-30)
  # ─────────────────────────────────────────
  # 배경: test job 실패 시 needs 연쇄로 reply job이 조용히 skip되고
  # artifact도 로그도 남지 않아 파이프라인이 며칠 멈춰도 인지할 수 없었다.
  # (08-25 / 08-30 두 날짜 모두 cron 실행이 예산 행에 흔적을 남기지 않은 것이 실측 확인됨)
  notify_blocked:
    name: Notify Blocked
    needs: [test, reply]
    if: always() && (needs.test.result != 'success' || needs.reply.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Write blocked summary
        run: |
          echo "## ⚠️ Reply 파이프라인 미실행" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | 결과 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| reply | ${{ needs.reply.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "원인 확인 후 재실행 필요. 미조치 시 멘션이 커서 전진 없이 누적됩니다." >> $GITHUB_STEP_SUMMARY
