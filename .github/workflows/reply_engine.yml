name: X Reply Engine

# ──────────────────────────────────────────────────────────────
# v1.1.0 (2026-09-10)
# ──────────────────────────────────────────────────────────────
# 내 게시글 댓글 자동 호응 답글 파이프라인 (run_reply.py)
#
# [제어 — GitHub Variables]
#   REPLY_ENABLED    : 'true'가 아니면 코드가 즉시 종료 (긴급 정지, HG-3)
#   REPLY_MODE       : dry_run | shadow | live (단계 전환은 마스터 수동, HG-1)
#   DAILY_BUDGET_KRW : 일일 비용 상한 (기본 1000)
#   X_READ_COST_KRW / X_WRITE_COST_KRW : 호출 단가 (미설정 시 count 모드 fallback)
#
# [모드 우선순위] dispatch input > vars.REPLY_MODE > 'dry_run' (schedule 안전 기본값)
# [cron] KST 10:17 / 13:17 / 18:17 / 22:17 — Actions 혼잡 시간대 분산
# ──────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "17 1,4,9,13 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드 (미지정 시 vars.REPLY_MODE)"
        type: choice
        options: [dry_run, shadow, live]
        default: dry_run
      confirm_live:
        description: "수동 live 실행 확인 (live 선택 시 필수)"
        type: boolean
        default: false

permissions:
  contents: read

# L3 가드: cron + dispatch 동시 실행 차단 (중복 답글 방지)
concurrency:
  group: reply-engine
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────
  # Job 1: 테스트 게이트
  # ─────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: pytest -q tests/

  # ─────────────────────────────────────────
  # Job 2: Reply 파이프라인
  # ─────────────────────────────────────────
  reply:
    name: Reply Pipeline
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40   # 기본 회당 2건: 시작 5분 + 첫 발행 10분 + 발행 간 최대 3분

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate live dispatch
        env:
          REQUESTED_MODE: ${{ inputs.mode || vars.REPLY_MODE || 'dry_run' }}
          CONFIRM_LIVE: ${{ inputs.confirm_live || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_MODE" == "live" && "$CONFIRM_LIVE" != "true" ]]; then
            echo "::error::수동 live 실행은 confirm_live를 선택해야 합니다."
            exit 1
          fi

      - name: Run Reply Engine
        env:
          # X (Twitter) OAuth 1.0a
          X_API_KEY:              ${{ secrets.X_API_KEY }}
          X_API_SECRET:           ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:         ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET:  ${{ secrets.X_ACCESS_TOKEN_SECRET }}

          # Supabase
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:           ${{ secrets.SUPABASE_KEY }}

          # Gemini 4키 chain (Main → Sub → Sub2 → Pay)
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_SUB_KEY:     ${{ secrets.GEMINI_API_SUB_KEY }}
          GEMINI_API_SUB_SUB_KEY: ${{ secrets.GEMINI_API_SUB_SUB_KEY }}
          GEMINI_API_SUB_PAY_KEY: ${{ secrets.GEMINI_API_SUB_PAY_KEY }}

          # 운영 제어 (GitHub Variables — HG-1/HG-3)
          REPLY_ENABLED:          ${{ vars.REPLY_ENABLED }}
          REPLY_MODE:             ${{ inputs.mode || vars.REPLY_MODE || 'dry_run' }}
          # v1.0.6 (2026-08-27): 일일 답글 상한 운영값 — 미등록 시 코드 기본값 8 (env_int 안전 파서)
          REPLY_DAILY_CAP:        ${{ vars.REPLY_DAILY_CAP }}
          REPLY_RUN_CAP:          ${{ vars.REPLY_RUN_CAP }}
          REPLY_AUTHOR_DAILY_CAP: ${{ vars.REPLY_AUTHOR_DAILY_CAP }}
          REPLY_CONV_DAILY_CAP:   ${{ vars.REPLY_CONV_DAILY_CAP }}
          REPLY_MAX_AGE_HOURS:    ${{ vars.REPLY_MAX_AGE_HOURS }}
          REPLY_RETRY_WINDOW_HOURS: ${{ vars.REPLY_RETRY_WINDOW_HOURS }}
          REPLY_MENTIONS_MAX_RESULTS: ${{ vars.REPLY_MENTIONS_MAX_RESULTS }}
          REPLY_PUBLISH_DELAY_MAX_SEC: ${{ vars.REPLY_PUBLISH_DELAY_MAX_SEC }}
          REPLY_LIKE_ENABLED:     ${{ vars.REPLY_LIKE_ENABLED }}
          REPLY_LIKE_PER_RUN:     ${{ vars.REPLY_LIKE_PER_RUN }}
          REPLY_LIKE_PER_DAY:     ${{ vars.REPLY_LIKE_PER_DAY }}
          DAILY_BUDGET_KRW:       ${{ vars.DAILY_BUDGET_KRW }}
          X_READ_COST_KRW:        ${{ vars.X_READ_COST_KRW }}
          X_WRITE_COST_KRW:       ${{ vars.X_WRITE_COST_KRW }}
          X_MY_USER_ID:           ${{ vars.X_MY_USER_ID }}

          # 운영 장애 알림 (미설정 시 core.alert가 안전하게 no-op)
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}

        run: python run_reply.py

      # 실행 리포트 artifact (모드 무관 — shadow/live 검수용, HG-2/HG-4)
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reply-report-${{ github.run_id }}
          path: |
            logs/reply_report_*.json
            logs/reply_*.log
          retention-days: 14
          if-no-files-found: warn
